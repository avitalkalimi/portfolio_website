<title>Supermarket Retail Intelligence</title>

<style>
  :root{
    --frame:#1f6bff; --bg:#e9eef9; --card:#fff; --ink:#1d1d1f; --muted:#6b7280; --line:#eceff5;
    --blue:#1463ff; --blue2:#6f8ff7; --blue3:#c9d4fb; --blue4:#e4e9fd;
    --bad:#d92d3a; --badbg:#fde8ea; --warn:#b7791f; --warnbg:#fdf3dc; --good:#15803d; --goodbg:#e3f6e9; --neu:#3b4a6b; --neubg:#e8ecf6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#cfd8ea;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);overflow:hidden}
  #viewport{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center}
  .stage{width:1600px;height:900px;transform-origin:top left;position:absolute;left:0;top:0;background:var(--frame);padding:12px;border-radius:6px}
  .frame{background:var(--bg);height:100%;border-radius:12px;padding:14px;display:grid;grid-template-rows:72px 1fr;gap:14px}
  header{background:#fff;border-radius:10px;display:flex;align-items:center;padding:0 22px;gap:28px}
  .title h1{margin:0;font-size:22px;letter-spacing:.4px;font-weight:700}
  .title p{margin:3px 0 0;font-size:11.5px;color:#444}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--blue)}
  .logo svg{width:34px;height:34px}
  nav{display:flex;gap:6px;margin-left:12px}
  nav button{background:none;border:0;font:inherit;font-size:14px;padding:8px 30px;cursor:pointer;color:#333;border-bottom:3px solid transparent}
  nav button.on{font-weight:600;border-bottom-color:#111;font-size:15px}
  .ctrl{margin-left:auto;display:flex;align-items:flex-end;gap:16px}
  .sel label{display:block;font-size:10px;font-style:italic;color:#444;margin-bottom:3px}
  .sel select{font:inherit;font-size:12px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;min-width:120px;background:#fff}
  .info{width:26px;height:26px;border-radius:50%;border:1.5px solid #333;display:grid;place-items:center;font-size:13px;font-weight:600;cursor:help}
  .reset{background:#111;color:#fff;border:0;border-radius:4px;font-size:12px;font-weight:600;padding:7px 26px;cursor:pointer;letter-spacing:.5px}
  main{display:grid;grid-template-columns:430px 1fr;gap:14px;min-height:0}
  .kpis{display:grid;grid-template-rows:repeat(4,1fr);gap:14px;min-height:0}
  .kpi{background:var(--card);border-radius:10px;display:grid;grid-template-columns:1fr 168px;padding:18px 22px;min-height:0}
  .kpi .l{border-right:1px solid var(--line);padding-right:14px;display:flex;flex-direction:column}
  .cap{font-size:10px;letter-spacing:2.2px;font-weight:600;color:#333;text-transform:uppercase}
  .big{font-size:36px;font-weight:600;letter-spacing:-1px;margin:6px 0 2px}
  .big small{font-size:20px;font-weight:600}
  .sub{font-size:10.5px;color:#555}
  .badge{display:inline-block;align-self:flex-start;margin-top:10px;font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px}
  .b-bad{color:var(--bad);background:var(--badbg)} .b-warn{color:var(--warn);background:var(--warnbg)}
  .b-good{color:var(--good);background:var(--goodbg)} .b-neu{color:var(--neu);background:var(--neubg)}
  .kpi .r{padding-left:16px;display:flex;flex-direction:column;justify-content:center;gap:15px}
  .kpi .r .cap{text-align:center;font-size:9px;margin-bottom:-2px}
  .kv{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#555;gap:6px}
  .kv b{font-size:12.5px;color:#111;font-weight:600}
  .kv i{display:inline-block;height:3px;border-radius:2px;margin-left:auto;margin-right:8px}
  .charts{display:grid;grid-template-rows:1fr 1fr;gap:14px;min-height:0}
  .row{display:grid;gap:14px;min-height:0}
  .card{background:var(--card);border-radius:10px;padding:16px 20px;display:flex;flex-direction:column;min-height:0;min-width:0}
  .card h3{margin:0;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:10px}
  .card .note{font-size:10.5px;font-style:italic;color:#555;margin-top:2px}
  .cv{flex:1;position:relative;min-height:0;margin-top:8px}
  .toggles{margin-left:auto;display:flex;gap:6px}
  .toggles button{font:inherit;font-size:12px;border:1px solid #bbb;background:#fff;border-radius:4px;padding:4px 18px;cursor:pointer;font-weight:400}
  .toggles button.on{background:#222;color:#fff;border-color:#222}
  .avg{margin-left:auto;font-size:11px;font-weight:400;color:#444}
  .tbl{flex:1;overflow:auto;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{background:#eef1f8;font-weight:500;text-align:right;padding:8px 8px;position:sticky;top:0;font-size:11.5px;vertical-align:bottom}
  thead th:first-child,tbody td:first-child{text-align:left}
  tbody td{white-space:nowrap;padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
  .pill{font-size:9px;font-weight:700;padding:2px 9px;border-radius:3px;display:inline-block;min-width:58px;text-align:center}
  .red{color:var(--bad)}
</style>
</head>

const quad = {id:'quad', beforeDatasetsDraw(c, _, o) { if (!o || o.x == null) return;
  const {ctx, chartArea:a, scales:{x, y}} = c; ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle = '#999';
  const px = x.getPixelForValue(o.x), py = y.getPixelForValue(o.y);
  ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke(); ctx.restore(); }};
Chart.register(centerText, quad);

const donut = (id, labels, values, colors, centerTxt, centerSub) => mk(id, {type:'doughnut',
  data:{labels, datasets:[{data:values, backgroundColor:colors, borderWidth:2, borderColor:'#fff'}]},
  options:{cutout:'62%', layout:{padding:{top:22, bottom:6, left:52, right:52}},
    plugins:{legend:{position:'bottom'}, center:{text:centerTxt, sub:centerSub},
      tooltip:{callbacks:{label:c => ` ${c.label}: ${n2(c.raw)}`}},
      datalabels:{display:true, anchor:'end', align:'end', offset:4, color:'#333', font:{size:11},
        formatter:(v, c) => pct(v / c.dataset.data.reduce((a, b) => a + b, 0))}}}});

const hbar = (id, labels, values, fmt, color='#1463ff') => mk(id, {type:'bar',
  data:{labels, datasets:[{data:values, backgroundColor:color, borderRadius:2, barPercentage:.6, categoryPercentage:.9}]},
  options:{indexAxis:'y', layout:{padding:{right:56}},
    scales:{x:{display:false, beginAtZero:true}, y:{grid:{display:false}, border:{display:false}, ticks:{color:'#333', font:{size:11.5}}}},
    plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => ' ' + fmt(c.raw)}},
      datalabels:{display:true, anchor:'end', align:'end', color:'#222', font:{size:11, weight:600}, formatter:fmt}}}});

// ---------- pages ----------
function subtitleText(a) {
  const ds = a.map(x => x.d).sort(), f = s => { const [y, m, d] = s.split('-'); return `${d} ${MONTHS[+m]} ${y}`; };
  const nb = new Set(a.map(x => x.b)).size;
  return a.length ? `${f(ds[0])} - ${f(ds[ds.length-1])} | ${nb} Branch${nb > 1 ? 'es' : ''} | ${new Set(a.map(x => x.p)).size} Product Lines | ${n0(a.length)} Transactions` : 'No data';
}
function prevMonthBadge(a) {
  if (!st.month || st.month === 1) {
    const bm = [...grp(filt({month:0}), x => x.m)].sort((p, q) => sales(q[1]) - sales(p[1]))[0];
    return badge('neu', `Best month: ${MONTHS[bm[0]]} (${k(sales(bm[1]))})`);
  }
  const prev = sales(filt({month:st.month - 1})), cur = sales(a), ch = cur / prev - 1;
  return badge(ch >= 0 ? 'good' : 'bad', `${ch >= 0 ? '+' : ''}${pct(ch)} vs ${MONTHS[st.month - 1]}`);
}

function overview(a) {
  const S = sales(a), GI = sum(a, x => x.gi), T = a.length, Q = sum(a, x => x.q), RT = avg(a, x => x.r);
  const byB = BRANCHES.map(b => [b, sales(a.filter(x => x.b === b))]);
  const maxB = Math.max(...byB.map(x => x[1]), 1);
  const days = new Set(a.map(x => x.d)).size;
  const rtCls = RT >= 7.5 ? 'good' : RT >= 7 ? 'warn' : 'bad';
  kpis.innerHTML = [
    kpi('Total Sales', k(S), `${byB.filter(x => x[1]).length} branches · ${n0(days)} trading days`, prevMonthBadge(a), 'By Branch',
      byB.map(([b, v]) => kv(`${b} · ${CITY[b]}`, k(v), {w:Math.max(4, 38*v/maxB), c:'#1463ff'}))),
    kpi('Gross Income', k(GI), `Margin ${pct(S ? GI/S : 0, 2)} of sales`, badge('warn', 'Thin margin - below 5%'), 'Profit Split',
      [kv('Sales', k(S)), kv('COGS', k(sum(a, x => x.cogs)), {w:30, c:'#d92d3a'}), kv('Tax 5%', k(sum(a, x => x.tax)))]),
    kpi('Transactions', n0(T), `${(T/Math.max(days, 1)).toFixed(1)} baskets per day`, badge('neu', `Avg basket ${n2(S/Math.max(T, 1))}`), 'Basket Detail',
      [kv('Avg Basket', n2(S/Math.max(T, 1))), kv('Items / Basket', (Q/Math.max(T, 1)).toFixed(2)), kv('Units Sold', n0(Q))]),
    kpi('Customer Rating', RT.toFixed(2) + '<small> /10</small>', `Target 7.5 · Gap ${(RT - 7.5).toFixed(2)}`,
      badge(rtCls, rtCls === 'good' ? 'On target' : rtCls === 'warn' ? 'Slightly below target' : 'Below target'), 'Rating Split',
      [kv('Promoters (≥8)', pct(a.filter(x => x.r >= 8).length/Math.max(T, 1)), {w:26, c:'#18b26b'}),
       kv('Passives (6-8)', pct(a.filter(x => x.r >= 6 && x.r < 8).length/Math.max(T, 1))),
       kv('Detractors (<6)', pct(a.filter(x => x.r < 6).length/Math.max(T, 1)), {w:26, c:'#d92d3a'})])
  ].join('');

  const metrics = {sales:['Sales', sales], income:['Gross Income', b => sum(b, x => x.gi)], tx:['Transactions', b => b.length], units:['Units', b => sum(b, x => x.q)]};
  charts_.innerHTML = `
    <div class="row" style="grid-template-columns:1fr">${card('cTrend', `${metrics[st.metric][0]} by Day`,
      `<div class="toggles">${Object.entries(metrics).map(([key, [lbl]]) => `<button data-m="${key}" class="${st.metric === key ? 'on' : ''}">${lbl}</button>`).join('')}</div>`)}</div>
    <div class="row" style="grid-template-columns:520px 1fr">
      ${card('cProd', 'Sales by Product Line')}
      <div class="card"><h3>Branch Performance Ranking</h3><div class="tbl" id="tBranch"></div></div>
    </div>`;
  charts_.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { st.metric = b.dataset.m; render(); });

  const byDay = [...grp(a, x => x.d)].sort((p, q) => p[0] < q[0] ? -1 : 1);
  const f = metrics[st.metric][1], vals = byDay.map(([, v]) => f(v)), av = avg(vals, x => x);
  mk('cTrend', {data:{labels:byDay.map(([d]) => st.month ? +d.slice(8) : `${MONTHS[+d.slice(5,7)]} ${+d.slice(8)}`),
    datasets:[{type:'line', label:`Average: ${st.metric === 'tx' || st.metric === 'units' ? av.toFixed(1) : k(av)}`, data:vals.map(() => av), borderColor:'#555', borderDash:[5,4], borderWidth:1.2, pointRadius:0},
              {type:'bar', label:metrics[st.metric][0], data:vals, backgroundColor:vals.map(v => v >= av ? '#1463ff' : '#8fa8f8'), borderRadius:2, barPercentage:.6}]},
    options:{scales:{x:{grid:{display:false}, ticks:{autoSkip:true, maxRotation:0, autoSkipPadding:8}}, y:{grid, beginAtZero:true, border:{display:false}, ticks:{callback:v => k(v)}}},
      plugins:{legend:{position:'top', align:'end', reverse:true}}}});

  const byP = PRODUCTS.map(p => [p, sales(a.filter(x => x.p === p))]).sort((p, q) => q[1] - p[1]);
  hbar('cProd', byP.map(x => x[0]), byP.map(x => x[1]), v => k(v));

  const allMonth = filt({branch:'All'}), netBasket = sales(allMonth) / Math.max(allMonth.length, 1);
  const rowsB = BRANCHES.map(b => { const x = a.filter(r => r.b === b), s = sales(x);
    return {b, city:CITY[b], s, t:x.length, basket:s/Math.max(x.length, 1), r:avg(x, r => r.r), share:s/Math.max(S, 1)}; })
    .filter(r => r.t).sort((p, q) => q.s - p.s);
  tBranch.innerHTML = `<table><thead><tr><th>Branch</th><th>City</th><th>Sales</th><th>Trans.</th><th>Avg Basket</th><th>Rating</th><th>Share</th><th>Status</th></tr></thead><tbody>${
    rowsB.map(r => { const ratio = r.basket / netBasket;
      const [c, t] = ratio >= 1.02 ? ['good', 'Strong'] : ratio >= .98 ? ['warn', 'Fair'] : ['bad', 'Attention'];
      return `<tr><td>Branch ${r.b}</td><td>${r.city}</td><td>${n0(r.s)}</td><td>${r.t}</td><td>${n2(r.basket)}</td><td class="${r.r < 7 ? 'red' : ''}">${r.r.toFixed(2)}</td><td>${pct(r.share)}</td><td><span class="pill b-${c}">${t}</span></td></tr>`; }).join('')
  }</tbody></table><div class="note" style="margin-top:10px">Status compares each branch's average basket with the network average (${n2(netBasket)}).</div>`;
}

function products(a) {
  const S = sales(a), T = a.length, Q = sum(a, x => x.q);
  const P = PRODUCTS.map(p => { const x = a.filter(r => r.p === p);
    return {p, s:sales(x), q:sum(x, r => r.q), t:x.length, up:avg(x, r => r.up), gi:sum(x, r => r.gi), r:avg(x, r => r.r)}; }).sort((p, q) => q.s - p.s);
  const top = P[0], low = P[P.length-1];
  const prices = a.map(x => x.up).sort((p, q) => p - q), med = prices.length ? prices[Math.floor(prices.length/2)] : 0;
  const sz = (lo, hi) => a.filter(x => x.q >= lo && x.q <= hi).length / Math.max(T, 1);
  const maxQ = Math.max(...P.map(x => x.q), 1);
  kpis.innerHTML = [
    kpi('Units Sold', n0(Q), `${PRODUCTS.length} product lines · ${(Q/Math.max(T, 1)).toFixed(2)} items/basket`, badge('neu', `Top: ${[...P].sort((p, q) => q.q - p.q)[0].p}`), 'Top Lines by Units',
      [...P].sort((p, q) => q.q - p.q).slice(0, 3).map(x => kv(x.p, n0(x.q), {w:Math.max(4, 30*x.q/maxQ), c:'#1463ff'}))),
    kpi('Avg Unit Price', n2(avg(a, x => x.up)), 'Average shelf price per item', badge('neu', `Median ${n2(med)}`), 'Price Range',
      [kv('Lowest', n2(prices[0] || 0)), kv('Median', n2(med)), kv('Highest', n2(prices[prices.length-1] || 0))]),
    kpi('Top Product Line', k(top.s), `${top.p} · ${pct(top.s/Math.max(S, 1))} of sales`, badge(low.s/top.s < .85 ? 'warn' : 'good', `Gap to lowest: ${pct(1 - low.s/top.s)}`), 'Lead vs Lowest',
      [kv('Top line', k(top.s)), kv(low.p, k(low.s), {w:20, c:'#d92d3a'}), kv('Gap', k(top.s - low.s))]),
    kpi('Basket Size', (Q/Math.max(T, 1)).toFixed(2), 'Average items per transaction', badge(sz(1, 3) > .3 ? 'warn' : 'good', `${pct(sz(1, 3))} small baskets`), 'Size Split',
      [kv('Small (1-3)', pct(sz(1, 3)), {w:24, c:'#d92d3a'}), kv('Medium (4-7)', pct(sz(4, 7))), kv('Large (8-10)', pct(sz(8, 10)), {w:24, c:'#18b26b'})])
  ].join('');

  charts_.innerHTML = `
    <div class="row" style="grid-template-columns:320px 1fr">
      ${card('cShare', 'Sales Share by Product Line')}
      ${card('cMonthP', 'Monthly Sales by Product Line')}
    </div>
    <div class="row" style="grid-template-columns:1fr 1fr">
      ${card('cBubble', 'Price vs Volume by Product Line', '', 'Bubble size = sales. Top-right lines sell many items at a high price; bottom-left lines are the weakest.')}
      <div class="card"><h3>Product Line × Branch Sales</h3><div class="tbl" id="tMatrix"></div></div>
    </div>`;

  const colorOf = p => PALETTE[PRODUCTS.indexOf(p)];
  mk('cShare', {type:'doughnut', data:{labels:P.map(x => x.p), datasets:[{data:P.map(x => x.s), backgroundColor:P.map(x => colorOf(x.p)), borderColor:'#fff', borderWidth:2}]},
    options:{cutout:'60%', layout:{padding:{top:8, bottom:4}}, plugins:{legend:{position:'bottom', labels:{font:{size:10}}}, center:{text:k(S), sub:'Total sales'},
      datalabels:{display:true, color:'#fff', font:{size:10, weight:600}, formatter:v => pct(v/Math.max(S, 1), 0)}}}});

  const ms = [...new Set(a.map(x => x.m))].sort();
  mk('cMonthP', {type:'bar', data:{labels:PRODUCTS, datasets:ms.map((m, i) => ({label:MONTHS[m], data:PRODUCTS.map(p => sales(a.filter(x => x.p === p && x.m === m))), backgroundColor:BLUES[i % 3], borderRadius:2, barPercentage:.8, categoryPercentage:.7}))},
    options:{scales:{x:{grid:{display:false}, ticks:{color:'#333'}}, y:{grid, border:{display:false}, ticks:{callback:v => k(v)}}}, plugins:{legend:{position:'top', align:'start'}}}});

  const maxS = Math.max(...P.map(x => x.s), 1);
  mk('cBubble', {type:'bubble', data:{datasets:P.map(x => ({label:x.p, data:[{x:x.up, y:x.q, r:8 + 18*Math.sqrt(x.s/maxS), s:x.s}], backgroundColor:colorOf(x.p) + 'cc'}))},
    options:{layout:{padding:{top:16, right:20}}, scales:{x:{title:{display:true, text:'Avg Unit Price'}, grid}, y:{title:{display:true, text:'Units Sold'}, grid}},
      plugins:{legend:{position:'right', labels:{font:{size:10}}}, quad:{x:avg(P, x => x.up), y:avg(P, x => x.q)},
        tooltip:{callbacks:{label:c => ` ${c.dataset.label}: price ${n2(c.raw.x)}, units ${n0(c.raw.y)}, sales ${k(c.raw.s)}`}}}}});

  const brs = BRANCHES.filter(b => a.some(x => x.b === b));
  const cells = P.map(x => brs.map(b => sales(a.filter(r => r.p === x.p && r.b === b))));
  const cmax = Math.max(...cells.flat(), 1);
  tMatrix.innerHTML = `<table><thead><tr><th>Product Line</th>${brs.map(b => `<th>Branch ${b}<br><span style="font-size:10px;color:#666">${CITY[b]}</span></th>`).join('')}<th>Total</th><th>Gross Inc.</th><th>Rating</th></tr></thead><tbody>${
    P.map((x, i) => `<tr><td>${x.p}</td>${cells[i].map(v => `<td style="background:rgba(20,99,255,${(.08 + .55*v/cmax).toFixed(2)});color:${v/cmax > .7 ? '#fff' : '#111'}">${n0(v)}</td>`).join('')}<td><b>${n0(x.s)}</b></td><td>${n0(x.gi)}</td><td class="${x.r < 7 ? 'red' : ''}">${x.r.toFixed(2)}</td></tr>`).join('')
  }</tbody></table>`;
}

function customers(a) {
  const S = sales(a), T = a.length;
  const seg = (f) => { const x = a.filter(f); return {s:sales(x), t:x.length, basket:sales(x)/Math.max(x.length, 1)}; };
  const mem = seg(x => x.ct === 'Member'), nor = seg(x => x.ct === 'Normal'), fem = seg(x => x.g === 'Female'), mal = seg(x => x.g === 'Male');
  const byH = [...grp(a, x => x.h)].map(([h, v]) => [h, sales(v)]).sort((p, q) => p[0] - q[0]);
  const peak = [...byH].sort((p, q) => q[1] - p[1])[0] || [0, 0], slow = [...byH].sort((p, q) => p[1] - q[1])[0] || [0, 0];
  const eve = sales(a.filter(x => x.h >= 17)) / Math.max(S, 1);
  const pays = [...grp(a, x => x.pay)].map(([p, v]) => [p, v.length/Math.max(T, 1), sales(v)]).sort((p, q) => q[1] - p[1]);
  kpis.innerHTML = [
    kpi('Member Share', pct(mem.s/Math.max(S, 1)), 'Share of sales from loyalty members', badge(mem.basket >= nor.basket ? 'good' : 'warn', `Member basket ${mem.basket >= nor.basket ? '+' : ''}${pct(mem.basket/nor.basket - 1)}`), 'Loyalty Split',
      [kv('Member sales', k(mem.s), {w:28, c:'#1463ff'}), kv('Normal sales', k(nor.s)), kv('Member basket', n2(mem.basket))]),
    kpi('Female Share', pct(fem.s/Math.max(S, 1)), 'Share of sales from female shoppers', badge('neu', `Female basket ${n2(fem.basket)}`), 'Gender Split',
      [kv('Female sales', k(fem.s), {w:28, c:'#f2399b'}), kv('Male sales', k(mal.s), {w:28, c:'#1463ff'}), kv('Male basket', n2(mal.basket))]),
    kpi('Peak Hour', hour(peak[0]), `${k(peak[1])} sales in the busiest hour`, badge('warn', `Slowest: ${hour(slow[0])}`), 'Traffic Detail',
      [kv('Peak sales', k(peak[1])), kv('Slowest hour', k(slow[1]), {w:18, c:'#d92d3a'}), kv('Evening (5-9 PM)', pct(eve))]),
    kpi('Payment Mix', pct(pays[0] ? pays[0][1] : 0), `${pays[0] ? pays[0][0] : '-'} is the leading method`, badge('neu', `${pays.length} payment methods`), 'By Method',
      pays.map(([p, sh]) => kv(p, pct(sh), {w:Math.max(4, 60*sh), c:'#1463ff'})))
  ].join('');

  charts_.innerHTML = `
    <div class="row" style="grid-template-columns:320px 1fr">
      ${card('cMem', 'Member vs Normal Sales')}
      ${card('cHour', 'Sales by Hour of Day')}
    </div>
    <div class="row" style="grid-template-columns:480px 1fr">
      ${card('cDow', 'Sales by Day of Week')}
      <div class="card"><h3>Customer Segment Analysis</h3><div class="tbl" id="tSeg"></div></div>
    </div>`;

  donut('cMem', ['Member', 'Normal'], [mem.s, nor.s], ['#1463ff', '#d6defc'], k(S), 'Total sales');

  const hv = byH.map(x => x[1]), ha = avg(hv, x => x);
  const lvl = v => v > ha*1.1 ? 0 : v >= ha*.9 ? 1 : 2;
  mk('cHour', {type:'bar', data:{labels:byH.map(x => hour(x[0])), datasets:[{data:hv, backgroundColor:hv.map(v => BLUES[lvl(v)]), borderRadius:2, barPercentage:.7}]},
    options:{scales:{x:{grid:{display:false}}, y:{grid, border:{display:false}, ticks:{callback:v => k(v)}}},
      plugins:{legend:{display:true, position:'bottom', labels:{generateLabels:() => ['High (>110% avg)', 'Medium', 'Low (<90% avg)'].map((t, i) => ({text:t, fillStyle:BLUES[i], strokeStyle:BLUES[i], pointStyle:'circle'}))}},
        tooltip:{callbacks:{label:c => ' ' + n2(c.raw)}}, datalabels:{display:true, anchor:'end', align:'end', color:'#444', font:{size:10}, formatter:v => k(v)}}, layout:{padding:{top:16}}}});

  const DOW = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const dw = DOW.map((d, i) => sales(a.filter(x => (new Date(x.d + 'T00:00:00').getDay() + 6) % 7 === i)));
  hbar('cDow', DOW, dw, v => k(v));

  const segs = [];
  ['Member', 'Normal'].forEach(c => ['Female', 'Male'].forEach(g => { const x = a.filter(r => r.ct === c && r.g === g);
    const fav = [...grp(x, r => r.pay)].sort((p, q) => q[1].length - p[1].length)[0];
    const favP = [...grp(x, r => r.p)].sort((p, q) => sales(q[1]) - sales(p[1]))[0];
    segs.push({n:`${c} · ${g}`, t:x.length, s:sales(x), basket:sales(x)/Math.max(x.length, 1), items:sum(x, r => r.q)/Math.max(x.length, 1), r:avg(x, r => r.r), pay:fav ? fav[0] : '-', top:favP ? favP[0] : '-'}); }));
  segs.sort((p, q) => q.s - p.s);
  tSeg.innerHTML = `<table><thead><tr><th>Segment</th><th>Trans.</th><th>Sales</th><th>Avg Basket</th><th>Items</th><th>Rating</th><th>Top Product Line</th><th>Payment</th></tr></thead><tbody>${
    segs.map(x => `<tr><td>${x.n}</td><td>${x.t}</td><td><b>${n0(x.s)}</b></td><td>${n2(x.basket)}</td><td>${x.items.toFixed(2)}</td><td>${x.r.toFixed(2)}</td><td>${x.top}</td><td>${x.pay}</td></tr>`).join('')
  }</tbody></table>`;
}

const charts_ = document.getElementById('charts');
const PAGES = {overview, products, customers};
function render() {
  charts.forEach(c => c.destroy()); charts = [];
  const a = filt();
  subtitle.textContent = subtitleText(a);
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.p === st.page));
  if (!a.length) { kpis.innerHTML = ''; charts_.innerHTML = '<div class="card"><h3>No data for this selection</h3></div>'; return; }
  PAGES[st.page](a);
}
nav.querySelectorAll('button').forEach(b => b.onclick = () => { st.page = b.dataset.p; render(); });
fMonth.onchange = () => { st.month = +fMonth.value; render(); };
fBranch.onchange = () => { st.branch = fBranch.value; render(); };
reset.onclick = () => { st.month = 0; st.branch = 'All'; st.metric = 'sales'; fMonth.value = '0'; fBranch.value = 'All'; render(); };

function fit() { const s = Math.min(innerWidth/1600, innerHeight/900), el = document.getElementById('stage');
  el.style.transform = `scale(${s})`; el.style.left = Math.max(0, (innerWidth - 1600*s)/2) + 'px'; el.style.top = Math.max(0, (innerHeight - 900*s)/2) + 'px'; }
addEventListener('resize', fit); fit();
render();
</script>
</body>
</html>
