<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סל ירוק – ניהול מלאי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{
    --g:#1e9e5a; --g2:#3fbf7f; --g3:#a7e3c3; --g4:#e6f6ed; --g5:#f3faf6; --dark:#0f5132;
    --ink:#1c2b22; --muted:#6b7a71; --line:#e8efe9; --bg:#eef5f0; --card:#fff;
    --red:#e5484d; --redbg:#fdecec; --amber:#e8a317; --amberbg:#fdf4e1; --blue:#3b82f6; --bluebg:#e8f0fe; --gray:#8a948e; --graybg:#eef1ef;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Heebo,"Segoe UI",sans-serif;color:var(--ink);background:#cfe3d6;overflow:hidden}
  .stage{width:1600px;height:900px;position:absolute;left:0;top:0;transform-origin:top left;background:var(--bg);border-radius:18px;overflow:hidden;
    display:grid;grid-template-columns:220px 1fr;box-shadow:0 20px 60px rgba(15,81,50,.18)}
  /* sidebar (right side in RTL) */
  aside{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px}
  .brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;color:var(--g);padding:0 8px 26px}
  .brand span{color:var(--ink);font-weight:600}
  .brand i{font-style:normal;font-size:28px}
  .navb{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;font:inherit;font-size:15px;color:#5d6d63;padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:6px;text-align:right}
  .navb svg{width:19px;height:19px;flex:none}
  .navb.on{background:var(--g);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(30,158,90,.3)}
  .navb:not(.on):hover{background:var(--g5);color:var(--g)}
  .asof{margin-top:auto;background:var(--g5);border:1px dashed var(--g3);border-radius:12px;padding:12px;font-size:12px;color:var(--dark);line-height:1.5}
  .asof b{display:block;font-size:13px}
  .demo{display:inline-block;margin-top:8px;background:var(--amberbg);color:#9a6a00;font-weight:600;border-radius:6px;padding:2px 8px;font-size:11px}
  /* main */
  .main{display:grid;grid-template-rows:64px 836px;min-width:0;min-height:0;height:900px}
  .top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:16px}
  .search{flex:0 1 380px;display:flex;align-items:center;gap:8px;background:var(--g5);border:1px solid var(--line);border-radius:22px;padding:8px 16px;color:var(--muted)}
  .search input{border:0;background:none;font:inherit;font-size:14px;outline:none;width:100%;color:var(--ink)}
  .search svg{width:16px;height:16px;flex:none;color:var(--g)}
  .fl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .fl select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:18px;padding:6px 12px;background:#fff;color:var(--ink);cursor:pointer}
  .top .sp{flex:1}
  .reset{border:1px solid var(--g);color:var(--g);background:#fff;font:inherit;font-weight:600;font-size:13px;border-radius:18px;padding:6px 16px;cursor:pointer}
  .reset:hover{background:var(--g);color:#fff}
  .user{display:flex;align-items:center;gap:10px;font-size:13px}
  .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;display:grid;place-items:center;font-weight:700}
  .content{padding:18px 26px;display:grid;gap:14px;min-height:0;height:836px;overflow:hidden}
  .content>*{min-height:0;min-width:0}
  h2{margin:0;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
  h2 small{font-size:12px;font-weight:400;color:var(--muted)}
  .sec{display:flex;align-items:center;justify-content:space-between}
  .link{color:var(--g);font-size:13px;font-weight:500}
  /* category tiles */
  .cats{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
  .cat{background:#fff;border:2px solid transparent;border-radius:14px;padding:10px 6px 9px;text-align:center;cursor:pointer;transition:.15s;position:relative}
  .cat:hover{transform:translateY(-2px)}
  .cat.on{border-color:var(--g);background:var(--g5)}
  .cat .e{font-size:30px;line-height:1.2}
  .cat .n{font-size:12.5px;font-weight:500;margin-top:2px}
  .cat .h{font-size:11px;color:var(--muted);margin-top:2px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:4px;vertical-align:middle}
  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:#fff;border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center}
  .ki{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none}
  .kpi .l{font-size:12.5px;color:var(--muted)}
  .kpi .v{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.3px}
  .kpi .s{font-size:11.5px;color:var(--muted)}
  .pill{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
  .p-g{background:var(--g4);color:var(--dark)} .p-r{background:var(--redbg);color:#b42318} .p-a{background:var(--amberbg);color:#8a5a00} .p-b{background:var(--bluebg);color:#1d4ed8} .p-n{background:var(--graybg);color:#4b5550}
  /* cards / grid */
  .row{display:grid;gap:14px;min-height:0}
  .card{background:#fff;border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
  .card h3{margin:0 0 2px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card h3 .x{margin-right:auto;font-size:12px;font-weight:400;color:var(--muted)}
  .note{font-size:11.5px;color:var(--muted)}
  .cv{flex:1 1 0;position:relative;min-height:0;margin-top:6px;overflow:hidden}
  .list{flex:1;overflow:auto;margin-top:6px}
  .li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
  .li .e{width:38px;height:38px;border-radius:50%;background:var(--g5);display:grid;place-items:center;font-size:20px;flex:none}
  .li .t{flex:1;min-width:0}
  .li .t b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .t span{font-size:11px;color:var(--muted)}
  .bar{height:6px;background:var(--graybg);border-radius:4px;overflow:hidden;margin-top:4px;width:120px}
  .bar i{display:block;height:100%;border-radius:4px}
  .btn{border:0;background:var(--g);color:#fff;font:inherit;font-size:12px;font-weight:600;border-radius:16px;padding:4px 12px;cursor:pointer}
  /* product cards */
  .prods{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;flex:1;min-height:0;margin-top:6px}
  .prod{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
  .prod .e{font-size:42px;line-height:1.1;margin:4px 0}
  .prod b{font-size:13px;font-weight:600}
  .prod .m{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
  .prod .ft{display:flex;justify-content:space-between;width:100%;align-items:center;margin-top:auto;font-size:12px}
  .prod .rank{position:absolute;top:8px;right:8px;background:var(--g);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{font-weight:500;color:var(--muted);text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;font-size:12px}
  tbody td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.num,th.num{text-align:left;font-variant-numeric:tabular-nums}
  .tbl{flex:1;overflow:auto;margin-top:4px}
  /* branch cards */
  .branches{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .bc{border-radius:16px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,#1e9e5a,#0f6e3d);position:relative;overflow:hidden;cursor:pointer;border:3px solid transparent}
  .bc.on{border-color:#0b3d24}
  .bc::after{content:"";position:absolute;left:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
  .bc .hd{display:flex;justify-content:space-between;align-items:flex-start}
  .bc h4{margin:0;font-size:18px;font-weight:700}
  .bc .city{font-size:12px;opacity:.85}
  .bc .big{font-size:30px;font-weight:800;margin:6px 0 2px}
  .bc .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;position:relative;z-index:1}
  .bc .grid div{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 8px}
  .bc .grid span{display:block;font-size:10.5px;opacity:.85}
  .bc .grid b{font-size:14px}
  .bc .tag{background:#fff;color:var(--dark);font-size:11px;font-weight:700;border-radius:12px;padding:3px 10px}
  .heat td.hc{text-align:center;font-weight:600}
</style>
</head>

  <aside>
    <div class="brand"><i>🛒</i>סל<span>ירוק</span></div>
    <button class="navb on" data-p="inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21V12h6v9"/></svg>ניהול מלאי</button>
    <button class="navb" data-p="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h12l2 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"/><path d="M4 6h16M9 11h6M9 15h4"/></svg>הזמנות רכש</button>

  <div class="main">
    <div class="top">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="חיפוש מוצר..."></label>

    </div>
    <div class="content" id="content"></div>
  </div>
</div>

  const onTime = done.filter(r => r.status === 'סופקה בזמן').length / Math.max(done.length, 1);
  const lt = done.length ? sum(done, r => days(r.od, r.recv)) / done.length : 0;
  const fill = done.length ? sum(done, r => r.fill) / done.length : 0;
  const lateOpen = open.filter(r => r.status === 'באיחור').length;
  content.innerHTML = `
    <div class="kpis">
      ${kpi('🧾', '#e6f6ed', 'הזמנות ברבעון', n0(p.length), `ערך רכש ${k(sum(p, r => r.value))}`)}
      ${kpi('🚚', '#e8f0fe', 'הזמנות פתוחות', open.length, `<span class="pill ${lateOpen ? 'p-r' : 'p-g'}">${lateOpen} באיחור</span> ערך ${k(sum(open, r => r.value))}`)}
      ${kpi('⏱️', onTime >= .9 ? '#e6f6ed' : '#fdf4e1', 'אספקה בזמן', pct(onTime), `<span class="pill ${onTime >= .9 ? 'p-g' : 'p-a'}">יעד 90%</span>`)}
      ${kpi('📦', '#f3e8ff', 'זמן אספקה / שלמות', `${n1(lt)} ימים`, `שלמות אספקה (Fill rate) ${pct(fill)}`)}
    </div>
    <div class="row" style="grid-template-columns:1.6fr 1fr">
      ${card('cWeek', 'ערך הזמנות לפי שבוע', '<span class="x">עמודות: ערך רכש · קו: % אספקה בזמן</span>')}
      ${card('cStat', 'סטטוס הזמנות')}
    </div>
    <div class="row" style="grid-template-columns:1.6fr 1fr">
      <div class="card"><h3>כרטיס ניקוד ספקים</h3><div class="tbl" id="tSup"></div></div>
      <div class="card"><h3>הזמנות אחרונות <span class="x">${open.length} פתוחות</span></h3><div class="list" id="recent"></div></div>
    </div>`;
  const wk = d => { const t = new Date(d), s = new Date('2018-12-31'); return Math.floor((t - s) / 6048e5); };
  const W = [...Array(13).keys()];
  const wl = W.map(w => { const s = new Date(Date.UTC(2018, 11, 31 + w * 7)); return `${String(s.getUTCDate()).padStart(2, '0')}.${String(s.getUTCMonth() + 1).padStart(2, '0')}`; });
  const byW = W.map(w => p.filter(r => wk(r.od) === w));
  mk('cWeek', {data:{labels:wl, datasets:[
      {type:'line', label:'% אספקה בזמן', yAxisID:'y2', data:byW.map(a => { const d = a.filter(r => r.recv); return d.length ? d.filter(r => r.status === 'סופקה בזמן').length / d.length * 100 : null; }), borderColor:'#e8a317', backgroundColor:'#e8a317', tension:.35, pointRadius:3, borderWidth:2},
      {type:'bar', label:'ערך רכש', data:byW.map(a => sum(a, r => r.value)), backgroundColor:'#1e9e5a', borderRadius:6, barPercentage:.6}]},
    options:{scales:{x:{grid:{display:false}, title:{display:true, text:'שבוע שמתחיל ב-'}}, y:{grid, ticks:{callback:v => k(v)}},
      y2:{position:'right', min:0, max:100, grid:{display:false}, ticks:{callback:v => v + '%'}}}, plugins:{legend:{position:'top', align:'start'}}}});
  const sts = Object.keys(POST), cols = {'סופקה בזמן':'#1e9e5a', 'סופקה באיחור':'#e8a317', 'בדרך':'#3b82f6', 'באיחור':'#e5484d', 'ממתינה לאישור':'#a0aaa4'};
  mk('cStat', {type:'doughnut', data:{labels:sts, datasets:[{data:sts.map(s => p.filter(r => r.status === s).length), backgroundColor:sts.map(s => cols[s]), borderColor:'#fff', borderWidth:3}]},
    options:{cutout:'64%', layout:{padding:8}, plugins:{legend:{position:'right', labels:{font:{size:12}}},
      datalabels:{display:c => c.dataset.data[c.dataIndex] / p.length > .04, color:'#fff', font:{weight:700}, formatter:v => v}}}});
  const sup = CAT_KEYS.filter(okC).map(c => { const a = p.filter(r => r.cat === c), d = a.filter(r => r.recv);
    const ot = d.filter(r => r.status === 'סופקה בזמן').length / Math.max(d.length, 1);
    return {c, n:a.length, v:sum(a, r => r.value), ot, lt:d.length ? sum(d, r => days(r.od, r.recv)) / d.length : 0, fill:d.length ? sum(d, r => r.fill) / d.length : 0, open:a.length - d.length}; })
    .sort((p, q) => q.ot - p.ot);
  tSup.innerHTML = `<table><thead><tr><th>ספק</th><th>קטגוריה</th><th class="num">הזמנות</th><th class="num">ערך רכש</th><th class="num">בזמן</th><th class="num">ימי אספקה</th><th class="num">שלמות</th><th class="num">פתוחות</th><th>דירוג</th></tr></thead><tbody>${
    sup.map(s => { const sc = s.ot * .6 + s.fill * .4, [t, c] = sc >= .93 ? ['מצוין', 'p-g'] : sc >= .85 ? ['טוב', 'p-b'] : ['דורש שיפור', 'p-r'];
      return `<tr><td><b>${CATS[s.c].supplier}</b></td><td>${CATS[s.c].emoji} ${CATS[s.c].he}</td><td class="num">${s.n}</td><td class="num">${k(s.v)}</td><td class="num" style="color:${s.ot < .8 ? '#b42318' : 'inherit'}">${pct(s.ot, 0)}</td><td class="num">${n1(s.lt)}</td><td class="num">${pct(s.fill, 0)}</td><td class="num">${s.open}</td><td><span class="pill ${c}">${t}</span></td></tr>`; }).join('')
  }</tbody></table>`;
  const rec = [...p].sort((p, q) => (q.od > p.od) - (q.od < p.od)).slice(0, 14);
  recent.innerHTML = rec.map(r => `<div class="li"><div class="e">${CATS[r.cat].emoji}</div><div class="t"><b>${r.id} · ${CATS[r.cat].supplier}</b>
    <span>${BR[r.b].he} · הוזמן ${fmtD(r.od)} · צפוי ${fmtD(r.exp)} · ${r.lines} פריטים</span></div>
    <div style="text-align:left"><b style="font-size:13px">${k(r.value)}</b><br><span class="pill ${POST[r.status]}">${r.status}</span></div></div>`).join('');
}

// ---------- page 3: branches ----------
function branches() {
  const t = TX.filter(r => okC(r.cat) && okQ(r.sid)), I = INV.filter(r => okC(r.cat) && okQ(r.sid)), P = PO.filter(r => okC(r.cat));
  const S = b => t.filter(r => r.b === b);
  const info = BR_KEYS.map(b => { const s = S(b), iv = I.filter(r => r.b === b), po = P.filter(r => r.b === b && r.recv);
    const sales = sum(s, r => r.t), V = sum(iv, r => r.value), cogs = sum(s, r => r.t - r.gi);
    return {b, sales, gi:sum(s, r => r.gi), n:s.length, basket:sales / Math.max(s.length, 1), rating:s.length ? sum(s, r => r.r) / s.length : 0,
      avail:iv.filter(r => r.status !== 'out').length / Math.max(iv.length, 1), V, turns:V ? cogs / V : 0,
      ot:po.filter(r => r.status === 'סופקה בזמן').length / Math.max(po.length, 1), alerts:iv.filter(r => r.status === 'out' || r.status === 'low').length}; });
  const best = [...info].sort((p, q) => q.sales - p.sales)[0].b;
  content.innerHTML = `
    <div class="sec"><h2>ביצועי סניפים <small>לחיצה על כרטיס סניף מסננת את הדוח</small></h2></div>
    <div class="branches">${info.map(x => `<div class="bc ${st.branch === x.b ? 'on' : ''}" data-b="${x.b}">
      <div class="hd"><div><h4>${BR[x.b].he}</h4><div class="city">${BR[x.b].city}</div></div>${x.b === best ? '<span class="tag">🏆 מוביל במכירות</span>' : `<span class="tag">${x.alerts} התראות מלאי</span>`}</div>
      <div class="big">${k(x.sales)}</div><div class="city">מכירות ברבעון · ${n0(x.n)} עסקאות · סל ממוצע ${n1(x.basket)}</div>
      <div class="grid"><div><span>זמינות מדף</span><b>${pct(x.avail, 0)}</b></div><div><span>מחזור מלאי</span><b>${x.turns.toFixed(1)}×</b></div><div><span>אספקה בזמן</span><b>${pct(x.ot, 0)}</b></div><div><span>דירוג לקוחות</span><b>${x.rating.toFixed(2)}</b></div></div></div>`).join('')}</div>
    <div class="row" style="grid-template-columns:1.5fr 1fr">
      ${card('cBrTrend', 'מכירות שבועיות לפי סניף')}
      ${card('cBrInv', 'מכירות מול ערך מלאי', '', 'יחס גבוה = מלאי שעובד; יחס נמוך = הון כלוא על המדף')}
    </div>
    <div class="row" style="grid-template-columns:1fr 1fr">
      <div class="card"><h3>זמינות מדף – סניף × קטגוריה <span class="x">% פריטים שאינם חסרים</span></h3><div class="tbl" id="tHeat"></div></div>
      <div class="card"><h3>מוצרים מובילים ${st.branch === 'All' ? 'ברשת' : 'ב' + BR[st.branch].he} <span class="x">לפי מכירות</span></h3><div class="tbl" id="tTop"></div></div>
    </div>`;
  content.querySelectorAll('[data-b]').forEach(el => el.onclick = () => { st.branch = st.branch === el.dataset.b ? 'All' : el.dataset.b; fBranch.value = st.branch; render(); });
  const wk = d => Math.floor((new Date(d) - new Date('2018-12-31')) / 6048e5);
  const W = [...Array(13).keys()], greens = ['#1e9e5a', '#7fd1a4', '#0f5132'];
  mk('cBrTrend', {type:'line', data:{labels:W.map(w => { const s = new Date(Date.UTC(2018, 11, 31 + w * 7)); return `${String(s.getUTCDate()).padStart(2, '0')}.${String(s.getUTCMonth() + 1).padStart(2, '0')}`; }),
      datasets:BR_KEYS.map((b, i) => ({label:BR[b].he + ' · ' + BR[b].city, data:W.map(w => sum(S(b).filter(r => wk(r.d) === w), r => r.t)),
        borderColor:greens[i], backgroundColor:greens[i] + '22', fill:st.branch === b, tension:.35, borderWidth:st.branch === 'All' || st.branch === b ? 2.5 : 1, pointRadius:2}))},
    options:{scales:{x:{grid:{display:false}}, y:{grid, ticks:{callback:v => k(v)}}}, plugins:{legend:{position:'top', align:'start'}}}});
  mk('cBrInv', {type:'bar', data:{labels:BR_KEYS.map(b => BR[b].he), datasets:[
      {label:'מכירות', data:info.map(x => x.sales), backgroundColor:'#1e9e5a', borderRadius:6, barPercentage:.7},
      {label:'ערך מלאי', data:info.map(x => x.V), backgroundColor:'#a7e3c3', borderRadius:6, barPercentage:.7}]},
    options:{scales:{x:{grid:{display:false}, ticks:{color:'#1c2b22', font:{size:12.5}}}, y:{grid, ticks:{callback:v => k(v)}}},
      plugins:{legend:{position:'top', align:'start'}, datalabels:{display:true, anchor:'end', align:'end', color:'#333', font:{size:10.5, weight:600}, formatter:v => k(v)}}, layout:{padding:{top:18}}}});
  const ck = CAT_KEYS.filter(okC), heatCol = v => v >= .95 ? ['#1e9e5a', '#fff'] : v >= .85 ? ['#7fd1a4', '#0f3d24'] : v >= .7 ? ['#fde7b0', '#6b4a00'] : ['#f8c9cb', '#8a1c1c'];
  tHeat.innerHTML = `<table class="heat"><thead><tr><th>קטגוריה</th>${BR_KEYS.map(b => `<th style="text-align:center">${BR[b].he}</th>`).join('')}</tr></thead><tbody>${
    ck.map(c => `<tr><td>${CATS[c].emoji} ${CATS[c].he}</td>${BR_KEYS.map(b => { const a = I.filter(r => r.b === b && r.cat === c), v = a.filter(r => r.status !== 'out').length / Math.max(a.length, 1), [bg, fg] = heatCol(v);
      return `<td class="hc" style="background:${bg};color:${fg}">${pct(v, 0)}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
  const tt = t.filter(r => okB(r.b)), by = {};
  tt.forEach(r => { by[r.sid] = by[r.sid] || {s:0, q:0}; by[r.sid].s += r.t; by[r.sid].q += r.q; });
  const top = Object.entries(by).sort((p, q) => q[1].s - p[1].s).slice(0, 7);
  tTop.innerHTML = `<table><thead><tr><th>מוצר</th><th>קטגוריה</th><th class="num">מכירות</th><th class="num">יחידות</th><th>מצב מלאי</th></tr></thead><tbody>${
    top.map(([sid, v]) => { const rs = I.filter(r => r.sid == sid && okB(r.b)), w = rs.some(r => r.status === 'out') ? 'out' : rs.some(r => r.status === 'low') ? 'low' : rs.some(r => r.status === 'over') ? 'over' : 'ok';
      return `<tr><td>${SKU[sid].emoji} <b>${SKU[sid].name}</b></td><td>${CATS[SKU[sid].cat].he}</td><td class="num">${k(v.s)}</td><td class="num">${v.q}</td><td><span class="pill ${STAT[w][1]}">${STAT[w][0]}</span></td></tr>`; }).join('')}</tbody></table>`;
}

function bindCats() { content.querySelectorAll('[data-c]').forEach(el => el.onclick = () => { st.cat = el.dataset.c; fCat.value = st.cat; render(); }); }
const PAGES = {inventory, orders, branches};
function render() {
  charts.forEach(c => c.destroy()); charts = [];
  document.querySelectorAll('.navb').forEach(b => b.classList.toggle('on', b.dataset.p === st.page));
  content.style.gridTemplateRows = {inventory:'auto auto auto 1fr 206px', orders:'auto 1fr 1fr', branches:'auto auto 1fr 1fr'}[st.page];
  PAGES[st.page]();
}
document.querySelectorAll('.navb').forEach(b => b.onclick = () => { st.page = b.dataset.p; render(); });
fBranch.onchange = () => { st.branch = fBranch.value; render(); };
fCat.onchange = () => { st.cat = fCat.value; render(); };
q.oninput = () => { st.q = q.value.trim(); render(); };
reset.onclick = () => { Object.assign(st, {branch:'All', cat:'All', q:''}); fBranch.value = 'All'; fCat.value = 'All'; q.value = ''; render(); };
function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900), el = stage;
  el.style.transform = `scale(${s})`; el.style.left = Math.max(0, (innerWidth - 1600 * s) / 2) + 'px'; el.style.top = Math.max(0, (innerHeight - 900 * s) / 2) + 'px'; }
addEventListener('resize', fit); fit();
document.fonts && document.fonts.ready.then(render); render();
</script>
</body>
</html>
